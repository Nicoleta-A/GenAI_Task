[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tariff-agent"
version = "0.1.0"
description = "Port tariff charge calculator with LLM-assisted rule extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "simpleeval",
  "pymupdf",
  "rank-bm25",
  "google-genai",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "pyyaml",
  "httpx",
  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
  "types-PyYAML",
]

[project.scripts]
tariff-agent = "tariff_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tariff_agent = ["extraction/prompts/*.md"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: tests that call live LLM APIs (deselected by default)",
]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends/File defaults are idiomatic

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tariff_agent"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "simpleeval",
  "rank_bm25",
  "pymupdf",
]
ignore_missing_imports = true
